# Netlify build and edge configuration.
#
# The build is a plain static export (`next.config.mjs`), so there is no
# Next.js runtime adapter here and none is wanted. `publish = "out"` is the
# whole integration.

[build]
  # The gate, not just the build. A deploy preview that renders a page whose
  # tests fail is a preview somebody approves, so the tests run here and a
  # failing one fails the deploy.
  #
  # `SKIP_BROWSER_TESTS` below is what makes that affordable: the accessibility
  # suite drives Chromium, and this build image is not guaranteed to have the
  # libraries it needs. GitHub Actions installs Chromium and runs it there, so
  # the check exists — it simply does not gate the deploy.
  command = "npm run verify"
  publish = "out"

[build.environment]
  # Node 24, which is LTS. Netlify supports 22, 24 and 26; 26 is Current and
  # becomes LTS in October 2026, and a marketing site is not where a
  # pre-LTS runtime earns its risk. `.nvmrc` carries the same number so a
  # developer using nvm builds on what Netlify builds on.
  #
  # Two native dependencies — sharp and playwright — are dev-only and neither
  # runs here: sharp draws the images a developer commits, and the browser
  # suite is skipped by SKIP_BROWSER_TESTS below. So the usual
  # native-module-across-Node-versions hazard does not apply to this build.
  NODE_VERSION = "24"
  # See the build command above, and `tests/a11y.test.ts`.
  SKIP_BROWSER_TESTS = "1"

# NO CATCH-ALL REDIRECT.
#
# The reflex on a static host is `/* -> /index.html 200`. Do not add one.
# `smpl.money/ads.txt` is what authorizes the advertising inventory on
# app.smpl.money, and a catch-all rewrite turns a missing or misspelled path
# into a 200 of HTML — which Google reads as an ads.txt that does not list the
# publisher id, the one documented state that demonetizes the domain outright.
# `trailingSlash: true` already gives every route its own index.html, so a
# fallback buys nothing. `docs/standards/operations.md` has the argument and
# `tests/export-shape.test.ts` fails if a catch-all appears here.

[[redirects]]
  from = "https://www.smpl.money/*"
  to = "https://smpl.money/:splat"
  status = 301
  force = true

# A moved page, not a fallback. The guide was "Moving to your own copy" while
# it covered one direction, and was renamed when it took in the other; the
# pricing page linked the old address, and so may anybody who saved it. The
# path is fixed, so it can never answer /ads.txt, which is what
# `tests/export-shape.test.ts` holds every rule here to.
[[redirects]]
  from = "/docs/moving-to-your-own-copy/*"
  to = "/docs/moving-between-cloud-and-self-hosted/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # `browsing-topics=()` because nothing on this origin is an ad. It is how
    # an ad network asks the browser what a visitor is interested in, and
    # allowing it would be an answer to a question nobody on this origin
    # asks. app.smpl.money's own headers are the application's to decide.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), browsing-topics=()"
    # Every source is this origin. `script-src` carries 'unsafe-inline'
    # because Next.js emits its hydration payload as inline <script> tags and
    # a static export has no request in which to mint a nonce. Removing it
    # means either build-time hashing of Next's bootstrap or dropping Next for
    # this page; `docs/standards/operations.md` records both.
    #
    # `tests/export-shape.test.ts` fails for any host in this policy at all,
    # which is the policy-level half of "no third-party script".
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

# The plain-Markdown copies of the docs and the learn guides, and /llms.txt
# that lists them (`content.md` 5.15). Both are `noindex`: they are the same
# words as the HTML pages, for readers that aren't browsers, and the HTML is
# what a search engine should index and an answer engine cite. A path `*`
# here stands for one segment, so `/*/*/index.md` is `/docs/<slug>/index.md`
# and `/learn/<slug>/index.md` and nothing shallower; no HTML page ends in
# `index.md`, so the noindex can't reach one. The content type is said rather
# than left to Netlify's guess for an extension it may not know.
[[headers]]
  for = "/*/*/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
