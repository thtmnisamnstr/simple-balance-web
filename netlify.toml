# Netlify build and edge configuration.
#
# The build is a plain static export (`next.config.mjs`), so there is no
# Next.js runtime adapter here and none is wanted. `publish = "out"` is the
# whole integration.

[build]
  # The gate, not just the build. A deploy preview that renders a page whose
  # tests fail is a preview somebody approves, so the tests run here and a
  # failing one fails the deploy.
  #
  # `SKIP_BROWSER_TESTS` below is what makes that affordable: the accessibility
  # suite drives Chromium, and this build image is not guaranteed to have the
  # libraries it needs. GitHub Actions installs Chromium and runs it there, so
  # the check exists — it simply does not gate the deploy.
  command = "npm run verify"
  publish = "out"

[build.environment]
  # Node 24, which is LTS. Netlify supports 22, 24 and 26; 26 is Current and
  # becomes LTS in October 2026, and a marketing site is not where a
  # pre-LTS runtime earns its risk. `.nvmrc` carries the same number so a
  # developer using nvm builds on what Netlify builds on.
  #
  # Two native dependencies — sharp and playwright — are dev-only and neither
  # runs here: sharp draws the images a developer commits, and the browser
  # suite is skipped by SKIP_BROWSER_TESTS below. So the usual
  # native-module-across-Node-versions hazard does not apply to this build.
  NODE_VERSION = "24"
  # See the build command above, and `tests/a11y.test.ts`.
  SKIP_BROWSER_TESTS = "1"

# NO CATCH-ALL REDIRECT.
#
# The reflex on a static host is `/* -> /index.html 200`. Do not add one.
# `smpl.money/ads.txt` is what authorizes the advertising inventory on
# app.smpl.money, and a catch-all rewrite turns a missing or misspelled path
# into a 200 of HTML — which Google reads as an ads.txt that does not list the
# publisher id, the one documented state that demonetizes the domain outright.
# `trailingSlash: true` already gives every route its own index.html, so a
# fallback buys nothing. `docs/standards/operations.md` has the argument and
# `tests/export-shape.test.ts` fails if a catch-all appears here.

[[redirects]]
  from = "https://www.smpl.money/*"
  to = "https://smpl.money/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # `interest-cohort` named FLoC, which Chrome withdrew in 2022 and which no
    # shipping browser implements, so the token denied nothing while reading
    # as a stance. `browsing-topics` is the live successor and the same
    # objection — it is how an ad network asks the browser what a visitor is
    # interested in — so denying it keeps the stance this header was already
    # taking rather than inventing a new one.
    #
    # It denies the targeting signal and not the ad. Measured against the
    # real script: same five hosts, no violation, no console message, and the
    # ad request still goes out. What it costs is relevance, and that is the
    # thing the withdrawn token was refusing.
    #
    # The auction and measurement features (`join-ad-interest-group`,
    # `run-ad-auction`, `attribution-reporting`, `private-aggregation`) are
    # deliberately left alone. Denying them measured just as clean, but they
    # are what an ad is sold through, so a blanket denial would cost fill
    # rather than refuse a signal.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), browsing-topics=()"
    # `script-src` carries 'unsafe-inline' because Next.js emits its hydration
    # payload as inline <script> tags and a static export has no request in
    # which to mint a nonce. Removing it means either build-time hashing of
    # Next's bootstrap or dropping Next for this page;
    # `docs/standards/operations.md` records both.
    #
    # **The five vendor hosts are observed, not documented.** A build carrying
    # the AdSense snippet was served over local HTTPS as smpl.money and driven
    # in Chromium across every page, and these are the hosts it reached, in the
    # directives it needed them in. The application's own ads policy uses a
    # blanket `https:` because it had no account to watch; this one does, and
    # a named host is the difference between a policy that permits Google and
    # one that permits anybody. `src/content/ads.ts` carries the same five with
    # what each serves, and `tests/adsense.test.ts` fails if this line loses
    # one or grows a wildcard.
    #
    # **The measurement was taken with the ad slot unfilled**, which is what
    # Auto ads returns on this origin today. A filled ad draws its creative
    # inside the `googleads.g.doubleclick.net` frame, where this policy does
    # not reach, so the five should hold — but the first page that fills is
    # the one to watch a console on before trusting that.
    #
    # Two absences are deliberate. `frame-src` names no 'self', because a
    # directive that is present replaces `default-src` for frames and nothing
    # same-origin is framed. `worker-src` and `child-src` are absent, so they
    # fall back to `default-src 'self'` — the measurement says nothing needs
    # them, and widening on a hunch is what the measurement exists to avoid.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://pagead2.googlesyndication.com https://ep2.adtrafficquality.google; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://pagead2.googlesyndication.com https://ep1.adtrafficquality.google; font-src 'self'; connect-src 'self' https://pagead2.googlesyndication.com https://ep1.adtrafficquality.google; frame-src https://googleads.g.doubleclick.net https://ep2.adtrafficquality.google https://www.google.com; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/ads.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"
