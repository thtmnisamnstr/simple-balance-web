name: verify

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the first. A marketing site's CI
# has nothing to learn from finishing a run whose commit is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Fixture values, not secrets, so the build this job runs is an
      # ad-bearing one rather than the absent-config state every contributor's
      # machine is in. `ADSENSE_CLIENT_ID` is the real account's id — already
      # public, in `public/ads.txt` and in every page's rendered HTML — so
      # using it here is what lets `tests/adsense.test.ts` keep proving the
      # two files agree. `ADSENSE_BANNER_SLOT_ID` is a placeholder: nobody has
      # told this repository the real one, and these tests are about the
      # mechanics of rendering whatever slot is configured, not about which
      # unit it is. The real values for the live site are Netlify's own
      # environment variables, never committed here.
      ADSENSE_CLIENT_ID: ca-pub-9953156598757474
      ADSENSE_BANNER_SLOT_ID: "1234567890"
      ADSENSE_CONSENT_MANAGED: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # From .nvmrc, so CI and Netlify and a developer's nvm cannot drift
          # apart. `docs/standards/operations.md` 5.3.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # `tests/a11y.test.ts` drives a real browser, because contrast and
      # computed styles cannot be checked in jsdom. Chromium only — the rules
      # it checks do not vary by engine, and three browsers would triple the
      # run for nothing.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify
        run: npm run verify

      # The export is what actually ships, so keep it when something fails:
      # a page that renders wrongly is far easier to diagnose from the HTML
      # than from a test name.
      - name: Upload the export
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out
          retention-days: 7

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # Internal links only. An external link checker fails on somebody
      # else's outage and trains people to ignore a red build.
      - name: Check internal links
        run: node scripts/check-links.mjs
